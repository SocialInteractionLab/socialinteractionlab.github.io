site: Social Interaction Lab
site_tagline: Social Interaction Lab at Stanford University!
logo_image: images/icon.png
url: socialinteractionlab@github.io
baseurl:

collections:
  news:
    output: true
    permalink: /news/:slug
  joining:
    output: true
    permalink: /joining/:slug

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
